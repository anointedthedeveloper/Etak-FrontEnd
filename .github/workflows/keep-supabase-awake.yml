# Supabase free projects pause after a week without activity. This runs a tiny
# real query twice a day so that never happens.
# Setup: repo → Settings → Secrets and variables → Actions → add
#   SUPABASE_URL       e.g. https://wotluxawncpqvgrvhdnw.supabase.co
#   SUPABASE_ANON_KEY  the project's anon (public) key
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
